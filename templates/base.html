<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f6f8">
<title>FinanceBot Admin</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #f8f9fb;
    --border: #e5e7eb;
    --text: #16181d;
    --text-muted: #6b7280;
    --text-faint: #9ca3af;
    --ink: #16181d;
    --ink-hover: #000000;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-tint: #eff6ff;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --danger-tint: #fef2f2;
    --up-bg: #fef2f2; --up-fg: #dc2626;
    --down-bg: #eff6ff; --down-fg: #2563eb;
    --ok-bg: #ecfdf5; --ok-fg: #059669;
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 7px;
    --shadow-card: 0 1px 2px rgba(16,24,40,.04), 0 1px 8px rgba(16,24,40,.04);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable",
      Pretendard, "Segoe UI", Roboto, sans-serif;
    max-width: 1080px; margin: 0 auto; padding: 0 20px 48px;
    background: var(--bg); color: var(--text); overflow-x: hidden;
    -webkit-font-smoothing: antialiased; line-height: 1.5;
  }
  a { touch-action: manipulation; color: var(--primary); }

  /* ---------- top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; margin: 0 -20px 28px; padding: 0 20px;
    background: rgba(245,246,248,.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border); }
  .topbar-inner { max-width: 1080px; margin: 0 auto; display: flex; align-items: center;
    gap: 4px; padding: 14px 0; overflow-x: auto; scrollbar-width: none; }
  .topbar-inner::-webkit-scrollbar { display: none; }
  .brand { font-weight: 800; font-size: 16px; letter-spacing: -.02em; color: var(--text);
    display: flex; align-items: center; gap: 6px; margin-right: 14px; flex: 0 0 auto;
    text-decoration: none; white-space: nowrap; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex: 0 0 auto; }
  nav { display: flex; gap: 2px; flex: 0 0 auto; }
  .icon { width: 15px; height: 15px; flex: 0 0 auto; display: inline-block; vertical-align: -3px; }
  nav a { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; text-decoration: none;
    color: var(--text-muted); font-weight: 600; font-size: 13.5px; padding: 7px 12px;
    border-radius: 999px; white-space: nowrap; transition: background-color .15s, color .15s; }
  nav a:hover { background: rgba(0,0,0,.04); color: var(--text); }
  nav a.active { background: var(--text); color: #fff; }
  .logout-form { display: flex; }
  .nav-btn { display: flex; align-items: center; gap: 6px; background: transparent; color: var(--text-muted);
    font-weight: 600; font-size: 13.5px; padding: 7px 12px; border: 0; border-radius: 999px; white-space: nowrap; }
  .nav-btn:hover { background: rgba(0,0,0,.04); color: var(--text); }
  .nav-btn:active { transform: none; }

  h1 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; margin: 4px 0 20px; }
  h2 { font-size: 14px; font-weight: 700; text-wrap: balance; margin: 0 0 14px; color: var(--text); }
  h2 .muted-count { color: var(--text-faint); font-weight: 500; }

  /* ---------- cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 20px; margin-bottom: 18px; box-shadow: var(--shadow-card); overflow-x: auto; }

  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 13.5px; }
  th, td { padding: 11px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
  td { font-variant-numeric: tabular-nums; max-width: 260px; overflow-wrap: break-word; }
  th { color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase;
    letter-spacing: .04em; scroll-margin-top: 16px; }
  tbody tr:last-child td, tr:last-child td { border-bottom: 0; }
  tbody tr:hover, table tr:hover { background: var(--surface-2); }
  .up, .down { display: inline-flex; padding: 2px 7px; border-radius: 6px; font-weight: 700; font-size: 13px; }
  .up { background: var(--up-bg); color: var(--up-fg); }
  .down { background: var(--down-bg); color: var(--down-fg); }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 700; }
  .badge.on { background: var(--ok-bg); color: var(--ok-fg); }
  .badge.off { background: var(--surface-2); color: var(--text-faint); }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- forms ---------- */
  label { font-size: 12.5px; color: var(--text-muted); font-weight: 600; cursor: pointer; }
  input, select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 14px; background: var(--surface); color: var(--text);
    font-variant-numeric: tabular-nums; transition: border-color .15s, box-shadow .15s;
    font-family: inherit; width: 100%; max-width: 100%;
  }
  input:hover, select:hover { border-color: #c7cad1; }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }

  /* ---------- buttons ---------- */
  button, a.btn { padding: 8px 16px; border: 1px solid transparent; border-radius: var(--radius-sm);
    background: var(--ink); color: #fff; cursor: pointer; font-size: 13.5px; font-weight: 600;
    touch-action: manipulation; transition: background-color .15s, opacity .15s, transform .1s, border-color .15s;
    white-space: nowrap; font-family: inherit; }
  button:hover { background: var(--ink-hover); }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  button.danger { background: transparent; color: var(--danger); border-color: var(--border); }
  button.danger:hover { background: var(--danger-tint); border-color: #fecaca; }
  button.secondary { background: transparent; color: var(--text); border-color: var(--border); }
  button.secondary:hover { background: var(--surface-2); border-color: #d1d5db; }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px; }

  pre { white-space: pre-wrap; font-size: 12.5px; background: var(--surface-2); padding: 12px;
    border-radius: var(--radius-md); border: 1px solid var(--border); line-height: 1.6; }
  details summary { cursor: pointer; font-weight: 600; font-size: 13.5px; padding: 4px 0; }

  /* ---------- profile tabs ---------- */
  .tabs { margin-bottom: 16px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs a { display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 999px;
    background: var(--surface); color: var(--text-muted); text-decoration: none; font-size: 13px;
    font-weight: 600; border: 1px solid var(--border);
    transition: background-color .15s, color .15s, border-color .15s; }
  .tabs a:hover { border-color: var(--primary); color: var(--primary); }
  .tabs a.active { background: var(--text); color: #fff; border-color: var(--text); }

  .banner { padding: 11px 14px; border-radius: var(--radius-md); font-size: 13.5px; margin-bottom: 16px;
    font-weight: 600; border: 1px solid transparent; display: flex; align-items: center; gap: 8px; }
  .banner .icon { width: 16px; height: 16px; vertical-align: 0; }
  .banner.ok { background: var(--ok-bg); color: var(--ok-fg); border-color: #a7f3d0; }
  .banner.fail { background: var(--danger-tint); color: var(--danger); border-color: #fecdd3; }

  .hint { font-size: 12.5px; color: var(--text-faint); margin-top: 10px; line-height: 1.6; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .001ms !important; animation-duration: .001ms !important; }
  }

  /* ---------- responsive ---------- */
  @media (max-width: 720px) {
    body { padding: 0 14px 40px; }
    .topbar { margin: 0 -14px 20px; padding: 0 14px; }
    .card { padding: 15px; border-radius: var(--radius-md); }
    h1 { font-size: 19px; }

    table, thead, tbody, tr { display: block; width: 100%; }
    table { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
    thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    tbody tr { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: 0; }
    td { display: flex; justify-content: space-between; align-items: center; gap: 12px;
      border-bottom: 0; padding: 5px 0; max-width: none; text-align: right; }
    td[data-label]::before { content: attr(data-label); font-size: 12px; font-weight: 600;
      color: var(--text-muted); text-align: left; flex: 0 0 auto; }
    td:not([data-label]) { justify-content: flex-start; }
    .row-actions { justify-content: flex-end; width: 100%; }
  }
</style>
</head>
<body>
{% if not hide_nav %}
<div class="topbar"><div class="topbar-inner">
  <a class="brand" href="/"><span class="dot"></span>FinanceBot</a>
  <nav>
    <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      대시보드</a>
    <a href="/holdings" class="{{ 'active' if request.url.path == '/holdings' else '' }}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      종목 관리</a>
    <a href="/profiles" class="{{ 'active' if request.url.path == '/profiles' else '' }}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      프로필</a>
    <a href="/settings" class="{{ 'active' if request.url.path == '/settings' else '' }}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      설정</a>
    <a href="/logs" class="{{ 'active' if request.url.path == '/logs' else '' }}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
      로그</a>
    {% if request.session.get('authed') %}
    <form method="post" action="/logout" class="logout-form">
      <button type="submit" class="nav-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        로그아웃</button>
    </form>
    {% endif %}
  </nav>
</div></div>
{% endif %}
{% block content %}{% endblock %}
</body>
</html>
